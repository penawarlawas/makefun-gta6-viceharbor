<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vice Harbor: top-down open-world crime game. Drive cars, run missions, evade Harbor Patrol.">
<title>Vice Harbor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; }

</style>
</head>
<body>
<canvas id="game" aria-label="Vice Harbor: top-down open-world crime game. Drive cars, run missions, evade Harbor Patrol."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
